<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>韩语学堂 · 한국어 배우기</title>
  <meta name="description" content="面向中文母语者的韩语入门学习网站：韩文字母、音节拼读、词汇卡片、情景短语、入门语法与测验，男女声发音示范，并为会日语的学习者提供日韩对照。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23c8323c'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='sans-serif'>한</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/home">
      <span class="brand-mark">한</span>
      <span class="brand-text">韩语学堂</span>
    </a>
    <div class="gender-switch" role="group" aria-label="默认发音声音">
      <button data-gender-set="female" title="使用女声朗读">👩<span>女声</span></button>
      <button data-gender-set="male" title="使用男声朗读">👨<span>男声</span></button>
    </div>
    <button class="ja-toggle" data-ja-toggle title="开关日语辅助（显示日语对照）" aria-label="日语辅助"><span class="jp" lang="ja">あ</span></button>
    <button class="menu-btn" id="menuBtn" aria-label="打开菜单" aria-expanded="false">☰</button>
    <nav class="nav" id="nav">
      <a href="#/home" data-route="home">首页</a>
      <a href="#/alphabet" data-route="alphabet">字母</a>
      <a href="#/pronounce" data-route="pronounce">发音</a>
      <a href="#/builder" data-route="builder">拼读</a>
      <a href="#/words" data-route="words">词汇</a>
      <a href="#/phrases" data-route="phrases">短语</a>
      <a href="#/grammar" data-route="grammar">语法</a>
      <a href="#/quiz" data-route="quiz">测验</a>
      <a href="#/japanese" data-route="japanese">日韩</a>
    </nav>
  </header>

  <main id="app" class="container" tabindex="-1"></main>

  <footer class="footer">
    <p>点击 🔊 / 👩 / 👨 可听发音（专业神经语音音频：女声 SunHi / 男声 InJoon，右上角可切换默认声音）。学习进度仅保存在本机浏览器中。</p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="audio/manifest.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ja.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
